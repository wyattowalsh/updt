[project]
name = "updt"
version = "0.1.0"
description = "Universal package dependency tracker and updater - detect and update dependencies across multiple package managers"
readme = "README.md"
authors = [
    { name = "Wyatt Walsh", email = "wyattowalsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "textual>=0.72.0",
    "rich>=13.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]

[project.scripts]
updt = "updt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/updt"]

[tool.updt]
# Default configuration for updt
log_level = "INFO"
log_format = "text"
default_mode = "plan"

[tool.updt.ecosystems]
# Enable/disable specific package managers
brew = true
softwareupdate = true
mas = true
uv = true
pip = true
npm = true
yarn = true
pnpm = true
gem = true
bundler = true
cargo = true
poetry = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
