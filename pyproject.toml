[project]
name = "updtr"
version = "0.1.0"
description = "Universal package dependency tracker and updater - detect and update dependencies across multiple package managers"
readme = "README.md"
authors = [
    { name = "Wyatt Walsh", email = "wyattowalsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "textual>=0.72.0",
    "rich>=13.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.147.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-html>=4.1.1",
    "pytest-icdiff>=0.9",
    "pytest-instafail>=0.5.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-watch>=4.2.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
    "build>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "shibuya>=2024.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "autoclasstoc>=1.6.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    "sphinx-tabs>=3.4.0",
    "sphinx-togglebutton>=0.3.0",
    "sphinxemoji>=0.3.0",
    "sphinxcontrib-mermaid>=0.9.0",
    "sphinx-click>=5.0.0",
    "sphinx-jsonschema>=1.19.0",
    "sphinxcontrib-httpdomain>=1.8.0",
    "sphinx-git>=11.0.0",
    "sphinx-hoverxref>=1.3.0",
    "sphinx-sitemap>=2.5.0",
    "sphinx-notfound-page>=1.0.0",
]

[project.scripts]
updtr = "updtr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/updtr"]

[tool.updtr]
# Default configuration for updtr
log_level = "INFO"
log_format = "text"
default_mode = "plan"

[tool.updtr.ecosystems]
# Enable/disable specific package managers

# macOS Ecosystem
brew = true
mas = true

# Python Ecosystem
uv = true
pip = true
pipx = true
conda = true
poetry = true
pyenv = true

# Node.js Ecosystem
npm = true
yarn = true
pnpm = true
nvm = true

# Ruby Ecosystem
gem = true
bundler = true
rvm = true

# Linux Ecosystem
apt = true
dnf = true
flatpak = true

# Windows Ecosystem
choco = true
scoop = true
winget = true

# Other
cargo = true
softwareupdate = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/updtr"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C90", "RUF"]
ignore = ["S603", "S607"]  # Allow subprocess calls, they're validated

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
targets = ["src/updtr"]
exclude_dirs = ["tests", "docs"]
skips = ["B603", "B607"]  # Allow subprocess usage with validated inputs

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
