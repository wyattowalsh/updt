[project]
name = "updt"
version = "0.1.0"
description = "Universal package dependency tracker and updater - detect and update dependencies across multiple package managers"
readme = "README.md"
authors = [
    { name = "Wyatt Walsh", email = "wyattowalsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "textual>=0.72.0",
    "rich>=13.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.5.0",
]
docs = [
    "sphinx>=7.0.0",
    "shibuya>=2024.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "autoclasstoc>=1.6.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    "sphinx-tabs>=3.4.0",
    "sphinx-togglebutton>=0.3.0",
    "sphinxemoji>=0.3.0",
    "sphinxcontrib-mermaid>=0.9.0",
    "sphinx-click>=5.0.0",
    "sphinx-jsonschema>=1.19.0",
    "sphinxcontrib-httpdomain>=1.8.0",
    "sphinx-git>=11.0.0",
    "sphinx-hoverxref>=1.3.0",
    "sphinx-sitemap>=2.5.0",
    "sphinx-notfound-page>=1.0.0",
]

[project.scripts]
updt = "updt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/updt"]

[tool.updt]
# Default configuration for updt
log_level = "INFO"
log_format = "text"
default_mode = "plan"

[tool.updt.ecosystems]
# Enable/disable specific package managers

# macOS Ecosystem
brew = true
mas = true

# Python Ecosystem
uv = true
pip = true
pipx = true
conda = true
poetry = true
pyenv = true

# Node.js Ecosystem
npm = true
yarn = true
pnpm = true
nvm = true

# Ruby Ecosystem
gem = true
bundler = true
rvm = true

# Linux Ecosystem
apt = true
dnf = true
flatpak = true

# Other
cargo = true
softwareupdate = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "C90", "RUF"]
ignore = ["S603", "S607"]  # Allow subprocess calls, they're validated

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
targets = ["src/updt"]
exclude_dirs = ["tests", "docs"]
skips = ["B603", "B607"]  # Allow subprocess usage with validated inputs

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
